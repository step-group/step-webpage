  description: Javiera Molina is a Pharmaceutical Chemist from the Pontificia Universidad Católica de Chile. She is currently pursuing a Ph.D. in Engineering and Sciences with Industry with Nestlé. Her research, co-supervised by  Sylvain Faugeron, centers on optimizing the extraction of proteins from seaweed using DES, for their application in food

- name: Vanesa Llanes
  photo: Llanes_Vanesa.jpg
  info: PhD Student
  email: vllanesh@estudiante.uc.cl
  description: Vanesa received her B.Sc. in Chemical Engineering from the Universidad Tecnológica de La Habana "José Antonio Echeverría" in December 2021 and is currently pursuing a Ph.D. in Engineering Sciences, with a focus on Chemical Engineering and Bioprocesses, at the Pontificia Universidad Católica de Chile. Supervised by Professor Roberto Canales, her research focuses on developing strategies for the extraction and purification of aroma compounds from fermentation broths.

- name: Fernando Martínez
  photo: Martinez_Fernando.jpg
  info: PhD Student
  email: ftmartinez1@uc.cl
  linkedin: https://cl.linkedin.com/in/fernando-martinez-herrera-634a4878
  description: Fernando Martínez holds a B.Sc. in Civil Engineering, a diploma in Chemical Engineering, and an M.Sc. in Engineering Sciences from the Pontificia Universidad Católica de Chile, with prior research experience in microalgae cultivation and photobioreactor design, biodegradability assays, and mining tailings treatment. He is currently pursuing a Ph.D. in Engineering Sciences at the same institution, supervised by Roberto Canales and co-supervised by Nicolás Gajardo-Parra. His research focuses on intensified extraction processes, combining process intensification with solvent design to improve the recovery of target compounds from complex matrices.

- name: Neyda Rivas
  photo: Rivas_Neyda.jpg
  info: PhD Student
  email: nrivasl@estudiante.uc.cl
  linkedin: https://bo.linkedin.com/in/neyda-rivas-1320b2209
  description: Neyda Rivas is a Chemical Engineer from the Universidad Católica Boliviana San Pablo (Cochabamba), where her undergraduate thesis addressed the evaluation of modified photocatalytic materials for removing recalcitrant pollutants from wastewater. She also holds a diploma in Strategic Management of Operations and Production Systems from the Universidad Privada Boliviana. She has two years of laboratory experience at ENDE Transmisión S.A., where she performed physicochemical, dissolved gas (gas chromatography) and furan analyses of dielectric oils, and later worked as a consultant, updating laboratory procedures and training new staff. She is currently pursuing a Ph.D. in Engineering Sciences at the Pontificia Universidad Católica de Chile. Her research focuses on valorizing grape pomace by extracting bioactive compounds with green solvents, aiming to develop safer, more sustainable ingredients for dermatological products.

- name: Javier Aguilera
  photo: Aguilera_Javier.jpg
  info: PhD Student
  email: jaguileral3@estudiante.uc.cl
  linkedin: https://cl.linkedin.com/in/javier-agustin-aguilera-lopez-62130a2b8
  description: Javier Aguilera is a biotechnology engineer on a mission to turn biological discovery into sustainable industry. Originally trained at the Universidad Católica del Maule in Chile, he built a strong foundation in bioprocess engineering, enzymology, and circular economy. His undergraduate thesis explored the heterologous production of Rhodococcus ruber laccase in bioreactors and its use in elastomeric blends. Beyond the lab, he is a 2025 National VIU Award winner (ANID) for leading a project that extracts antioxidants from agro-industrial waste, and a co-founder of the startup SIBION. Today, he is pursuing a PhD in Engineering Sciences with a focus on Chemical Engineering and Bioprocesses at the Pontificia Universidad Católica de Chile (UC), where his doctoral research will harness Natural Deep Eutectic Solvents (NADES) to create greener, safer solutions for food applications.
