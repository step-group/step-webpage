- name: Esteban Cea-Klapp
  photo: Cea_Esteban.png
  info: Postdoctoral Fellow
  email: esteban.cea@uc.cl
  linkedin: https://www.linkedin.com/in/esteban-cea-klapp-a70aab180/
  description: Esteban Cea-Klapp holds a PhD in Chemical Engineering from UDEC, with expertise in thermodynamic modeling, molecular simulations, and the design of sustainable solvent systems. His research focuses on deep eutectic solvents (DESs) for green chemical processes, integrating multiscale modeling and computational tools to predict thermophysical and interfacial properties. Esteban’s work bridges molecular insights with process-level applications, contributing to the development of efficient and environmentally friendly technologies for CO₂ capture and biomass valorization.

- name: Gabriel Galdames
  photo: Galdames_Gabriel.jpg
  info: Postdoctoral Fellow
  email: gabriel.galdames@uc.cl
  linkedin: https://cl.linkedin.com/in/gabriel-galdames-oliva-b67585161/es
  description: Gabriel Galdames is a Chemical Engineer from the Universidad de Concepción, Chile, where he started in heterogeneous catalysis with an undergraduate thesis on CO₂ hydrogenation to methanol. He stayed at the same university for his PhD in Engineering Sciences (Chemical Engineering, 2025), studying the oxidative dehydrogenation of methanol over supported vanadium and molybdenum oxides. His doctoral work combined fixed-bed kinetics, kinetic modeling, and transient and isotopic operando FTIR spectroscopy, and included a research stay at the Instituto de Tecnología Química (UPV-CSIC) in Valencia, Spain. Since 2026, he has been a postdoctoral researcher at the Pontificia Universidad Católica de Chile in an ANID Anillo project on CO₂ capture and its conversion into high-value chemicals with green H₂. There, he operates an adsorption-based CO₂ capture prototype and prepares and characterizes adsorbent materials. His work spans the full CO₂ valorization chain, from capture to catalytic transformation into fuels and chemicals.

- name: Gabriel Ibrahin Tovar
  photo: Tovar_Gabriel.jpg
  info: Postdoctoral Fellow
  email: gabriel.tovar@usm.cl
  linkedin: https://www.linkedin.com/in/gabriel-ibrahin-tovar/
  description: Gabriel Ibrahin Tovar holds a PhD in Nanotechnology from the University of Buenos Aires and has a multidisciplinary background in chemistry, environmental science, and renewable natural resources. His research focuses on the synthesis and characterization of nanostructured materials and biopolymer-based systems for environmental and biotechnological applications, including CO₂ capture, water purification, pollutant adsorption, and protein separation. His work integrates advanced materials characterization techniques with the development of metal–organic frameworks, chitin-based composites, hydrogels, and functional nanomaterials. Gabriel’s research bridges materials science, sustainability, and applied innovation, contributing to the development of efficient technologies.
